<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Market</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14202b;--mute:#5b6b7a;--line:#d5dde5;--acc:#0f766e;--acc-ink:#fff;--coin:#b27700;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0e1620;--card:#16212d;--ink:#e8eef4;--mute:#93a4b4;--line:#27374a;--acc:#2dd4bf;--acc-ink:#042f2b;--coin:#f5b942;--err:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;max-width:640px;margin:0 auto}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:20px 0 8px}
.coins{font-weight:700;color:var(--coin)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mute{color:var(--mute);font-size:14px}
input,textarea{width:100%;padding:11px;margin:0 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.small{padding:7px 12px;font-size:14px}
button:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:14px 4px}
nav button.on{color:var(--acc);box-shadow:inset 0 3px var(--acc)}
#msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:9;max-width:90%;display:none}
#msg.err{background:var(--err);color:#fff}
.hide{display:none!important}
.tabs{display:flex;gap:8px;margin-bottom:12px}
</style>
</head>
<body>
<div id="msg" role="status"></div>

<!-- Logged out -->
<main id="authView" class="hide">
  <h1 style="margin:40px 0 4px">Coin Market</h1>
  <p class="mute">Buy and sell items with coins.</p>
  <div class="card">
    <input id="u" placeholder="Username" autocomplete="username" autocapitalize="none">
    <input id="p" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
    <div class="tabs">
      <button id="loginBtn">Log in</button>
      <button id="regBtn" class="ghost">Create account</button>
    </div>
  </div>
</main>

<!-- Logged in -->
<div id="appView" class="hide">
  <header>
    <h1>Coin Market</h1>
    <span class="coins" id="coinTop">0 coins</span>
  </header>
  <main>
    <section id="v-market">
      <input id="search" type="search" placeholder="Search listings">
      <div id="items"></div>
    </section>

    <section id="v-sell" class="hide">
      <h2>List an item</h2>
      <div class="card">
        <input id="t" placeholder="Title" maxlength="100">
        <textarea id="d" rows="3" placeholder="Description (optional)" maxlength="1000"></textarea>
        <input id="pr" type="number" min="1" inputmode="numeric" placeholder="Price in coins">
        <button id="listBtn">Publish listing</button>
      </div>
      <h2>My listings and purchases</h2>
      <div id="mine"></div>
    </section>

    <section id="v-acct" class="hide">
      <h2 id="who"></h2>
      <div class="card">
        <input id="amt" type="number" min="1" inputmode="numeric" placeholder="Number of coins">
        <div class="tabs">
          <button id="buyCoins">Buy coins</button>
          <button id="sellCoins" class="ghost">Cash out coins</button>
        </div>
      </div>
      <h2>Recent activity</h2>
      <div id="tx"></div>
      <button id="logout" class="ghost" style="margin-top:16px">Log out</button>
    </section>
  </main>
  <nav>
    <button data-v="market" class="on">Market</button>
    <button data-v="sell">Sell</button>
    <button data-v="acct">Account</button>
  </nav>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = null, me = null, msgTimer;
try { token = localStorage.getItem('token'); } catch {}

function toast(text, isErr) {
  const m = $('msg');
  m.textContent = text; m.className = isErr ? 'err' : ''; m.style.display = 'block';
  clearTimeout(msgTimer); msgTimer = setTimeout(() => (m.style.display = 'none'), 3000);
}

async function api(path, method = 'GET', body) {
  const res = await fetch('/api' + path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && token) { logout(); }
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}
const run = async (fn) => { try { await fn(); } catch (e) { toast(e.message, true); } };

function setUser(user) {
  me = user;
  $('coinTop').textContent = Number(user.coins).toLocaleString() + ' coins';
  $('who').textContent = user.username;
}

function logout() {
  token = null; me = null;
  try { localStorage.removeItem('token'); } catch {}
  show();
}

function show() {
  $('authView').classList.toggle('hide', !!token);
  $('appView').classList.toggle('hide', !token);
  if (token) { refreshMe(); loadItems(); }
}

async function authenticate(kind) {
  const data = await api('/' + kind, 'POST', { username: $('u').value, password: $('p').value });
  token = data.token;
  try { localStorage.setItem('token', token); } catch {}
  $('p').value = '';
  show();
}

async function refreshMe() {
  const data = await api('/me');
  setUser(data.user);
  $('tx').innerHTML = data.transactions.length
    ? data.transactions.map((t) => `<div class="card row"><div>${esc(t.note || t.kind)}<div class="mute">${new Date(t.created_at).toLocaleString()}</div></div><b>${t.amount > 0 ? '+' : ''}${Number(t.amount).toLocaleString()}</b></div>`).join('')
    : '<p class="mute">No activity yet. Buy coins to get started.</p>';
}

async function loadItems() {
  const { items } = await api('/items?q=' + encodeURIComponent($('search').value));
  $('items').innerHTML = items.length
    ? items.map((i) => `<div class="card"><div class="row"><b>${esc(i.title)}</b><span class="coins">${Number(i.price).toLocaleString()}</span></div>
        <div class="mute">${esc(i.description)}</div><div class="row" style="margin-top:10px;align-items:center"><span class="mute">by ${esc(i.seller)}</span>
        ${me && i.seller_id === me.id ? '<span class="mute">Your listing</span>' : `<button class="small" data-buy="${i.id}">Buy</button>`}</div></div>`).join('')
    : '<p class="mute">No listings found. Be the first to list something in the Sell tab.</p>';
}

async function loadMine() {
  const { items } = await api('/my/items');
  $('mine').innerHTML = items.length
    ? items.map((i) => `<div class="card row" style="align-items:center"><div>${esc(i.title)}<div class="mute">${i.role === 'bought' ? 'Bought' : i.status === 'sold' ? 'Sold' : i.status === 'removed' ? 'Removed' : 'Active'} · ${Number(i.price).toLocaleString()} coins</div></div>
        ${i.role === 'selling' && i.status === 'active' ? `<button class="small ghost" data-del="${i.id}">Remove</button>` : ''}</div>`).join('')
    : '<p class="mute">Nothing here yet.</p>';
}

function view(name) {
  for (const v of ['market', 'sell', 'acct']) $('v-' + v).classList.toggle('hide', v !== name);
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.v === name));
  if (name === 'market') run(loadItems);
  if (name === 'sell') run(loadMine);
  if (name === 'acct') run(refreshMe);
}

$('loginBtn').onclick = () => run(() => authenticate('login'));
$('regBtn').onclick = () => run(() => authenticate('register'));
$('logout').onclick = logout;
$('search').oninput = () => run(loadItems);
document.querySelectorAll('nav button').forEach((b) => (b.onclick = () => view(b.dataset.v)));

$('items').onclick = (e) => {
  const id = e.target.dataset.buy;
  if (!id) return;
  run(async () => {
    const d = await api(`/items/${id}/buy`, 'POST');
    setUser({ ...me, coins: d.coins });
    toast('Purchased');
    await loadItems();
  });
};

$('mine').onclick = (e) => {
  const id = e.target.dataset.del;
  if (!id) return;
  run(async () => { await api('/items/' + id, 'DELETE'); toast('Removed'); await loadMine(); });
};

$('listBtn').onclick = () => run(async () => {
  await api('/items', 'POST', { title: $('t').value, description: $('d').value, price: $('pr').value });
  $('t').value = $('d').value = $('pr').value = '';
  toast('Listing published');
  await loadMine();
});

const coinAction = (kind, done) => () => run(async () => {
  const d = await api('/coins/' + kind, 'POST', { amount: $('amt').value });
  setUser({ ...me, coins: d.coins });
  $('amt').value = '';
  toast(done);
  await refreshMe();
});
$('buyCoins').onclick = coinAction('buy', 'Coins added');
$('sellCoins').onclick = coinAction('sell', 'Coins cashed out');

show();
</script>
</body>
          </html>
