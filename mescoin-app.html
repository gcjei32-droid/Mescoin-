<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MesCoin</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080e1d;
    color: white;
}

header {
    background: #111a33;
    text-align: center;
    padding: 25px 15px;
    border-bottom: 1px solid #26345b;
}

header h1 {
    margin: 0 0 12px;
    color: #55d6ff;
    font-size: 30px;
}

.status {
    display: inline-block;
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 14px;
}

.checking {
    background: #403518;
    color: #ffd66b;
}

.online {
    background: #123d2a;
    color: #62e6a5;
}

.offline {
    background: #4a1720;
    color: #ff9aa4;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 22px;
}

.card {
    background: #121b35;
    border: 1px solid #26345b;
    border-radius: 18px;
    padding: 26px;
    margin-bottom: 22px;
}

h2 {
    color: #55d6ff;
    margin-top: 0;
}

input,
select {
    width: 100%;
    padding: 16px;
    margin: 8px 0;
    border-radius: 13px;
    border: 1px solid #30416d;
    background: #080f25;
    color: white;
    font-size: 16px;
    outline: none;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 12px;
    border: none;
    border-radius: 13px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.blue {
    background: #1677ff;
}

.green {
    background: #159447;
}

.red {
    background: #d83248;
}

.gray {
    background: #394463;
}

.hidden {
    display: none !important;
}

.message {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #18233f;
    color: #b9c8e8;
    text-align: center;
}

.stat {
    background: #0c142b;
    border: 1px solid #26345b;
    padding: 18px;
    border-radius: 14px;
    margin: 10px 0;
}

.stat-title {
    color: #91a0c4;
    font-size: 14px;
}

.stat-value {
    font-size: 25px;
    font-weight: bold;
    margin-top: 7px;
}

.price {
    color: #55d6ff;
}

.row {
    display: flex;
    gap: 10px;
}

.row button {
    flex: 1;
}

.order {
    background: #0c142b;
    border: 1px solid #26345b;
    border-radius: 12px;
    padding: 15px;
    margin-top: 10px;
}

.small {
    color: #91a0c4;
    font-size: 13px;
}

hr {
    border: none;
    border-top: 1px solid #26345b;
    margin: 22px 0;
}
</style>
</head>
