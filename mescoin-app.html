<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MesCoin</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080e1d;
    color: white;
}

header {
    background: #111a33;
    text-align: center;
    padding: 25px 15px;
    border-bottom: 1px solid #26345b;
}

header h1 {
    margin: 0 0 12px;
    color: #55d6ff;
    font-size: 30px;
}

.status {
    display: inline-block;
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 14px;
}

.status.checking {
    background: #4a1720;
    color: #ff9aa4;
}

.status.online {
    background: #123d2a;
    color: #62e6a5;
}

.status.offline {
    background: #4a1720;
    color: #ff9aa4;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 22px;
}

.card {
    background: #121b35;
    border: 1px solid #26345b;
    border-radius: 18px;
    padding: 26px;
    margin-bottom: 22px;
}

h2 {
    color: #55d6ff;
    margin-top: 0;
}

input {
    width: 100%;
    padding: 17px;
    margin: 9px 0;
    border-radius: 14px;
    border: 1px solid #30416d;
    background: #080f25;
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #2196ff;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 12px;
    border: none;
    border-radius: 13px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.blue {
    background: #1677ff;
}

.green {
    background: #159447;
}

.red {
    background: #d83248;
}

.gray {
    background: #394463;
}

button:disabled {
    opacity: .5;
}

.hidden {
    display: none !important;
}

.message {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #18233f;
    color: #b9c8e8;
    text-align: center;
}

.stat {
    background: #0c142b;
    border: 1px solid #26345b;
    padding: 18px;
    border-radius: 14px;
    margin: 10px 0;
}

.stat-title {
    color: #91a0c4;
    font-size: 14px;
}

.stat-value {
    font-size: 25px;
    font-weight: bold;
    margin-top: 7px;
}

.price {
    color: #55d6ff;
}

.row {
    display: flex;
    gap: 10px;
}

.row button {
    flex: 1;
}

.order {
    background: #0c142b;
    border: 1px solid #26345b;
    border-radius: 12px;
    padding: 15px;
    margin-top: 10px;
}

.small {
    color: #91a0c4;
    font-size: 13px;
}

hr {
    border: none;
    border-top: 1px solid #26345b;
    margin: 22px 0;
}
</style>
</head>

<body>

<header>
    <h1>MesCoin</h1>

    <div id="serverStatus" class="status checking">
        Checking server...
    </div>
</header>

<div class="container">

    <!-- AUTH PAGE -->
    <div id="authPage">

        <div class="card">

            <h2>Login</h2>

            <input
                id="loginEmail"
                type="email"
                placeholder="Email"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
            >

            <button
                class="blue"
                onclick="login()"
            >
                Login
            </button>

            <div id="loginMessage" class="message hidden"></div>

        </div>


        <div class="card">

            <h2>Create Account</h2>

            <input
                id="registerUsername"
                type="text"
                placeholder="Username"
            >

            <input
                id="registerEmail"
                type="email"
                placeholder="Email"
            >

            <input
                id="registerPassword"
                type="password"
                placeholder="Password"
            >

            <button
                class="green"
                onclick="registerAccount()"
            >
                Create Account
            </button>

            <div id="registerMessage" class="message hidden"></div>

        </div>

    </div>


    <!-- APP PAGE -->
    <div id="appPage" class="hidden">

        <div class="card">

            <h2 id="welcome">
                Welcome
            </h2>

            <button
                class="gray"
                onclick="logout()"
            >
                Logout
            </button>

        </div>


        <!-- PORTFOLIO -->

        <div class="card">

            <h2>Portfolio</h2>

            <div class="stat">
                <div class="stat-title">
                    MesCoin Balance
                </div>

                <div
                    id="mesBalance"
                    class="stat-value"
                >
                    0 MES
                </div>
            </div>


            <div class="stat">

                <div class="stat-title">
                    Cash Balance
                </div>

                <div
                    id="cashBalance"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    MesCoin Price
                </div>

                <div
                    id="coinPrice"
                    class="stat-value price"
                >
                    0
                </div>

            </div>

        </div>


        <!-- TRADING -->

        <div class="card">

            <h2>Trade MesCoin</h2>

            <input
                id="tradeAmount"
                type="number"
                min="0"
                step="0.01"
                placeholder="Amount of MES"
            >

            <div class="row">

                <button
                    class="green"
                    onclick="buyMesCoin()"
                >
                    Buy
                </button>

                <button
                    class="red"
                    onclick="sellMesCoin()"
                >
                    Sell
                </button>

            </div>

            <div
                id="tradeMessage"
                class="message hidden"
            ></div>

        </div>


        <!-- MARKET -->

        <div class="card">

            <h2>Market</h2>

            <div class="stat">

                <div class="stat-title">
                    Current MES Price
                </div>

                <div
                    id="marketPrice"
                    class="stat-value price"
                >
                    Loading...
                </div>

            </div>

            <button
                class="blue"
                onclick="loadMarket()"
            >
                Refresh Market
            </button>

        </div>


        <!-- ORDERS -->

        <div class="card">

            <h2>Marketplace</h2>

            <input
                id="orderAmount"
                type="number"
                min="0"
                step="0.01"
                placeholder="MES amount"
            >

            <input
                id="orderPrice"
                type="number"
                min="0"
                step="0.01"
                placeholder="Price per MES"
            >

            <div class="row">

                <button
                    class="green"
                    onclick="createOrder('buy')"
                >
                    Buy Order
                </button>

                <button
                    class="red"
                    onclick="createOrder('sell')"
                >
                    Sell Order
                </button>

            </div>

            <div
                id="orderMessage"
                class="message hidden"
            ></div>

            <hr>

            <h2>Orders</h2>

            <div id="orders">
                Loading orders...
            </div>

        </div>


        <!-- TRADING HISTORY -->

        <div class="card">

            <h2>Trade History</h2>

            <div id="trades">
                Loading...
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   MESCOIN SERVER
===================================================== */

const API = "https://mescoin-1.onrender.com";


/* =====================================================
   HELPERS
===================================================== */

function showMessage(id, text) {

    const element = document.getElementById(id);

    element.textContent = text;
    element.classList.remove("hidden");
}


function hideMessage(id) {

    document.getElementById(id)
        .classList.add("hidden");
}


function getToken() {

    return localStorage.getItem("mescoin_token");

}


function headers() {

    const token = getToken();

    const h = {
        "Content-Type": "application/json"
    };

    if (token) {
        h["Authorization"] = "Bearer " + token;
    }

    return h;
}


/* =====================================================
   SERVER STATUS
===================================================== */

async function checkServer() {

    const status =
        document.getElementById("serverStatus");

    status.className = "status checking";
    status.textContent = "Checking server...";

    const controller = new AbortController();

    const timeout =
        setTimeout(() => {
            controller.abort();
        }, 15000);

    try {

        const response = await fetch(
            API + "/api/status",
            {
                method: "GET",
                cache: "no-store",
                signal: controller.signal
            }
        );

        clearTimeout(timeout);

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        if (
            data.success === true ||
            data.status === "online"
        ) {

            status.className =
                "status online";

            status.textContent =
                "Server connected";

            return true;
        }

        throw new Error(
            "Server returned invalid status"
        );

    } catch (error) {

        clearTimeout(timeout);

        status.className =
            "status offline";

        if (error.name === "AbortError") {

            status.textContent =
                "Server timeout";

        } else {

            status.textContent =
                "Server connection failed";

        }

        console.log(
            "MesCoin server error:",
            error
        );

        return false;
    }
}


/* =====================================================
   REGISTER
===================================================== */

async function registerAccount() {

    const username =
        document.getElementById(
            "registerUsername"
        ).value.trim();

    const email =
        document.getElementById(
            "registerEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "registerPassword"
        ).value;

    if (!username || !email || !password) {

        showMessage(
            "registerMessage",
            "Please fill in all fields."
        );

        return;
    }

    showMessage(
        "registerMessage",
        "Creating account..."
    );

    try {

        const response =
            await fetch(
                API + "/api/auth/register",
                {
                    method: "POST",
                    headers: headers(),
                    body: JSON.stringify({
                        username,
                        email,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                data.error ||
                "Registration failed"
            );
        }

        if (data.token) {

            localStorage.setItem(
                "mescoin_token",
                data.token
            );

            showApp();

            return;
        }

        showMessage(
            "registerMessage",
            data.message ||
            "Account created. You can now login."
        );

    } catch (error) {

        showMessage(
            "registerMessage",
            error.message
        );
    }
}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;

    if (!email || !password) {

        showMessage(
            "loginMessage",
            "Enter your email and password."
        );

        return;
    }

    showMessage(
        "loginMessage",
        "Logging in..."
    );

    try {

        const response =
            await fetch(
                API + "/api/auth/login",
                {
                    method: "POST",
                    headers: headers(),
                    body: JSON.stringify({
                        email,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                data.error ||
                "Login failed"
            );
        }

        if (!data.token) {

            throw new Error(
                "Server did not return login token."
            );
        }

        localStorage.setItem(
            "mescoin_token",
            data.token
        );

        showApp();

    } catch (error) {

        showMessage(
            "loginMessage",
            error.message
        );
    }
}


/* =====================================================
   SHOW APP
===================================================== */

async function showApp() {

    document
        .getElementById("authPage")
        .classList.add("hidden");

    document
        .getElementById("appPage")
        .classList.remove("hidden");

    await loadAccount();
    await loadPortfolio();
    await loadMarket();
    await loadOrders();
    await loadTrades();
}


/* =====================================================
   ACCOUNT
===================================================== */

async function loadAccount() {

    try {

        const response =
            await fetch(
                API + "/api/me",
                {
                    headers: headers()
                }
            );

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        const user =
            data.user || data;

        if (user.username) {

            document.getElementById(
                "welcome"
            ).textContent =
                "Welcome, " + user.username;
        }

    } catch (error) {

        console.log(
            "Account error:",
            error
        );
    }
}


/* =====================================================
   PORTFOLIO
===================================================== */

async function loadPortfolio() {

    try {

        const response =
            await fetch(
                API + "/api/portfolio",
                {
                    headers: headers()
                }
            );

        if (!response.ok) {

            throw new Error(
                "Portfolio request failed"
            );
        }

        const data =
            await response.json();

        const portfolio =
            data.portfolio || data;

        const mes =
            portfolio.mes_balance ??
            portfolio.mesBalance ??
            portfolio.mes ??
            0;

        const cash =
            portfolio.cash_balance ??
            portfolio.cashBalance ??
            portfolio.cash ??
            0;

        document.getElementById(
            "mesBalance"
        ).textContent =
            Number(mes).toFixed(2) + " MES";

        document.getElementById(
            "cashBalance"
        ).textContent =
            Number(cash).toFixed(2);

    } catch (error) {

        console.log(
            "Portfolio error:",
            error
        );
    }
}


/* =====================================================
   MARKET
===================================================== */

async function loadMarket() {

    try {

        const response =
            await fetch(
                API + "/api/market",
                {
                    headers: headers()
                }
            );

        if (!response.ok) {

            throw new Error(
                "Market request failed"
            );
        }

        const data =
            await response.json();

        const price =
            data.price ??
            data.currentPrice ??
            data.market?.price ??
            0;

        document.getElementById(
            "coinPrice"
        ).textContent =
            Number(price).toFixed(2);

        document.getElementById(
            "marketPrice"
        ).textContent =
            Number(price).toFixed(2);

    } catch (error) {

        console.log(
            "Market error:",
            error
        );

        document.getElementById(
            "marketPrice"
        ).textContent =
            "Unavailable";
    }
}


/* =====================================================
   BUY
===================================================== */

async function buyMesCoin() {

    const amount =
        Number(
            document.getElementById(
                "tradeAmount"
            ).value
        );

    if (!amount || amount <= 0) {

        showMessage(
            "tradeMessage",
            "Enter a valid MES amount."
        );

        return;
    }

    if (!confirm(
        "Buy " + amount + " MES?"
    )) {
        return;
    }

    showMessage(
        "tradeMessage",
        "Sending buy order..."
    );

    try {

        const response =
            await fetch(
                API + "/api/trade/buy",
                {
                    method: "POST",
                    headers: headers(),
                    body: JSON.stringify({
                        amount
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                data.error ||
                "Buy failed"
            );
        }

        showMessage(
            "tradeMessage",
            data.message ||
            "Buy completed successfully."
        );

        document.getElementById(
            "tradeAmount"
        ).value = "";

        await loadPortfolio();
        await loadTrades();

    } catch (error) {

        showMessage(
            "tradeMessage",
            error.message
        );
    }
}


/* =====================================================
   SELL
===================================================== */

async function sellMesCoin() {

    const amount =
        Number(
            document.getElementById(
                "tradeAmount"
            ).value
        );

    if (!amount || amount <= 0) {

        showMessage(
            "tradeMessage",
            "Enter a valid MES amount."
        );

        return;
    }

    if (!confirm(
        "Sell " + amount + " MES?"
    )) {
        return;
    }

    showMessage(
        "tradeMessage",
        "Sending sell order..."
    );

    try {

        const response =
