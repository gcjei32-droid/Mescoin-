<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Market</title>
<style>
  :root{--bg:#0f1722;--panel:#162231;--line:#243246;--text:#e6edf5;--mute:#8696aa;--accent:#2dd4bf;--bad:#ff8a7a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif;padding:24px 16px 80px;max-width:720px;margin-inline:auto}
  h1{margin:0 0 4px;font-size:26px} h2{font-size:18px;margin:0 0 12px}
  p.sub{color:var(--mute);margin:0 0 20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:14px;font:inherit;margin-bottom:10px}
  input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:12px 16px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06312c}
  button:disabled{opacity:.5}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row input{flex:1;min-width:120px;margin:0}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .bal{font-size:28px;font-weight:700;color:var(--accent)}
  .item{border-top:1px solid var(--line);padding:12px 0}
  .item:first-of-type{border-top:0}
  .item b{display:block}.item small{color:var(--mute)}
  .price{color:var(--accent);font-weight:700}
  .toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--bad);color:#2b0b06;padding:12px 20px;border-radius:10px;font-weight:600;max-width:90vw;z-index:9}
  .toast.ok{background:var(--accent);color:#06312c}
  .pos{color:var(--accent)}.neg{color:var(--bad)}
  .hidden{display:none}
</style>
</head>
<body>
<div id="toast" class="toast hidden"></div>
<h1>Coin Market</h1>
<p class="sub">Buy and sell items with coins.</p>

<!-- Logged out -->
<div id="authView" class="card">
  <input id="u" placeholder="Username" autocomplete="username">
  <input id="p" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <div class="row">
    <button class="primary" id="loginBtn">Log in</button>
    <button id="regBtn">Create account</button>
  </div>
</div>

<!-- Logged in -->
<div id="appView" class="hidden">
  <div class="card">
    <div class="top">
      <div><small style="color:var(--mute)" id="who"></small><div class="bal"><span id="coins">0</span> coins</div></div>
      <button id="logoutBtn">Log out</button>
    </div>
    <div class="row">
      <input id="amt" type="number" min="1" placeholder="Coin amount">
      <button class="primary" id="buyCoins">Buy coins</button>
      <button id="sellCoins">Cash out</button>
    </div>
  </div>

  <div class="card">
    <h2>Marketplace</h2>
    <div class="row" style="margin-bottom:8px">
      <input id="q" placeholder="Search listings">
      <button id="searchBtn">Search</button>
    </div>
    <div id="items"></div>
  </div>

  <div class="card">
    <h2>Sell an item</h2>
    <input id="title" placeholder="Title" maxlength="100">
    <textarea id="desc" rows="3" placeholder="Description (optional)" maxlength="1000"></textarea>
    <div class="row">
      <input id="price" type="number" min="1" placeholder="Price in coins">
      <button class="primary" id="listBtn">List item</button>
    </div>
  </div>

  <div class="card"><h2>My items</h2><div id="mine"></div></div>
  <div class="card"><h2>Recent activity</h2><div id="tx"></div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let token = null, me = null, tt;
try { token = localStorage.getItem('token'); } catch {}

function say(msg, ok) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast' + (ok ? ' ok' : '');
  clearTimeout(tt); tt = setTimeout(() => t.classList.add('hidden'), 3500);
}
async function api(path, method = 'GET', body) {
  let res;
  try {
    res = await fetch('/api' + path, {
      method,
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch { throw new Error('Cannot reach the server. Open this page from your deployed site, not a downloaded file.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401 && token) logout(true);
    throw new Error(data.error || 'Request failed');
  }
  return data;
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const run = (fn) => async () => { try { await fn(); } catch (e) { say(e.message); } };

function setSession(d) {
  token = d.token; me = d.user;
  try { localStorage.setItem('token', token); } catch {}
  showApp();
}
function logout(expired) {
  token = null; me = null;
  try { localStorage.removeItem('token'); } catch {}
  $('authView').classList.remove('hidden'); $('appView').classList.add('hidden');
  if (expired) say('Please log in again');
}
async function showApp() {
  $('authView').classList.add('hidden'); $('appView').classList.remove('hidden');
  await Promise.all([refreshMe(), loadItems(), loadMine()]);
}
async function refreshMe() {
  const d = await api('/me');
  me = d.user;
  $('who').textContent = '@' + me.username;
  $('coins').textContent = Number(me.coins).toLocaleString();
  $('tx').innerHTML = d.transactions.length ? d.transactions.map((t) => {
    const n = Number(t.amount);
    return `<div class="item"><b class="${n >= 0 ? 'pos' : 'neg'}">${n >= 0 ? '+' : ''}${n.toLocaleString()}</b><small>${esc(t.note || t.kind)} · ${new Date(t.created_at).toLocaleDateString()}</small></div>`;
  }).join('') : '<small style="color:var(--mute)">No activity yet. Buy coins to get started.</small>';
}
async function loadItems() {
  const { items } = await api('/items?q=' + encodeURIComponent($('q').value.trim()));
  $('items').innerHTML = items.length ? items.map((i) => `
    <div class="item">
      <b>${esc(i.title)}</b>
      <small>${esc(i.description || 'No description')} · by @${esc(i.seller)}</small>
      <div class="row" style="margin-top:8px;justify-content:space-between">
        <span class="price">${Number(i.price).toLocaleString()} coins</span>
        ${me && i.seller_id === me.id ? '<small>Your listing</small>' : `<button class="primary" data-buy="${i.id}">Buy</button>`}
      </div>
    </div>`).join('') : '<small style="color:var(--mute)">No listings yet. Be the first to sell something.</small>';
}
async function loadMine() {
  const { items } = await api('/my/items');
  $('mine').innerHTML = items.length ? items.map((i) => `
    <div class="item">
      <b>${esc(i.title)}</b>
      <div class="row" style="justify-content:space-between">
        <small>${i.role === 'bought' ? 'Bought' : i.status === 'sold' ? 'Sold' : i.status === 'removed' ? 'Removed' : 'Listed'} · ${Number(i.price).toLocaleString()} coins</small>
        ${i.role === 'selling' && i.status === 'active' ? `<button data-del="${i.id}">Remove</button>` : ''}
      </div>
    </div>`).join('') : '<small style="color:var(--mute)">Nothing here yet.</small>';
}
const reloadAll = () => Promise.all([refreshMe(), loadItems(), loadMine()]);

$('loginBtn').onclick = run(async () => setSession(await api('/login', 'POST', { username: $('u').value, password: $('p').value })));
$('regBtn').onclick = run(async () => setSession(await api('/register', 'POST', { username: $('u').value, password: $('p').value })));
$('logoutBtn').onclick = () => logout();
$('searchBtn').onclick = run(loadItems);
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('searchBtn').click(); });
$('p').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
$('buyCoins').onclick = run(async () => { await api('/coins/buy', 'POST', { amount: $('amt').value }); say('Coins added', true); $('amt').value = ''; await refreshMe(); });
$('sellCoins').onclick = run(async () => { await api('/coins/sell', 'POST', { amount: $('amt').value }); say('Coins cashed out', true); $('amt').value = ''; await refreshMe(); });
$('listBtn').onclick = run(async () => {
  await api('/items', 'POST', { title: $('title').value, description: $('desc').value, price: $('price').value });
  $('title').value = $('desc').value = $('price').value = '';
  say('Item listed', true); await reloadAll();
});
$('items').onclick = run(async (e) => {
  const id = e.target.dataset?.buy; if (!id) return;
  await api(`/items/${id}/buy`, 'POST'); say('Purchased', true); await reloadAll();
});
$('mine').onclick = run(async (e) => {
  const id = e.target.dataset?.del; if (!id) return;
  await api(`/items/${id}`, 'DELETE'); say('Listing removed', true); await reloadAll();
});

if (token) showApp().catch((e) => say(e.message));
</script>
</body>
  </html>
