<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MesCoin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:white;
}

header{
  padding:18px;
  background:#111a33;
  text-align:center;
}

h1{
  margin:0;
  color:#4da6ff;
}

.container{
  padding:20px;
  max-width:600px;
  margin:auto;
}

.card{
  background:#151e38;
  padding:20px;
  margin-bottom:18px;
  border-radius:14px;
}

input,button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:8px;
  border:0;
  font-size:16px;
}

input{
  background:#263250;
  color:white;
}

button{
  background:#1677ff;
  color:white;
  font-weight:bold;
}

button:active{
  background:#0d5dcc;
}

.balance{
  font-size:28px;
  color:#4da6ff;
  font-weight:bold;
}

.status{
  text-align:center;
  padding:10px;
  margin-bottom:15px;
  border-radius:8px;
  background:#252d45;
}

.success{
  color:#4dff88;
}

.error{
  color:#ff6666;
}

small{
  color:#aaa;
}
</style>
</head>

<body>

<header>
<h1>MesCoin</h1>
</header>

<div class="container">

<div id="status" class="status">
Connecting to MesCoin server...
</div>

<div class="card">
<h2>My Balance</h2>
<div class="balance" id="balance">0 MES</div>
</div>

<div class="card">
<h2>Buy MesCoin</h2>

<input
id="buyAmount"
type="number"
placeholder="Enter amount of MES">

<button onclick="buyCoin()">
Buy MesCoin
</button>
</div>

<div class="card">
<h2>Sell MesCoin</h2>

<input
id="sellAmount"
type="number"
placeholder="Enter amount of MES">

<button onclick="sellCoin()">
Sell MesCoin
</button>
</div>

<div class="card">
<h2>Send MesCoin</h2>

<input
id="recipient"
type="text"
placeholder="Recipient">

<input
id="sendAmount"
type="number"
placeholder="Amount of MES">

<button onclick="sendCoin()">
Send MesCoin
</button>
</div>

<div class="card">
<h2>Server</h2>
<small>
https://mescoin-1.onrender.com
</small>
</div>

</div>

<script>

const SERVER =
"https://mescoin-1.onrender.com";

/* -------------------------
   SERVER CONNECTION
------------------------- */

async function checkServer(){

  try{

    const response =
      await fetch(SERVER + "/", {
        method:"GET"
      });

    if(response.ok){

      document.getElementById("status").innerHTML =
        "● Server connected";

      document.getElementById("status").className =
        "status success";

      loadBalance();

    }else{

      throw new Error("Server error");

    }

  }catch(error){

    document.getElementById("status").innerHTML =
      "● Server offline";

    document.getElementById("status").className =
      "status error";

  }

}


/* -------------------------
   LOAD BALANCE
------------------------- */

async function loadBalance(){

  try{

    const response =
      await fetch(SERVER + "/balance");

    if(!response.ok) return;

    const data =
      await response.json();

    if(data.balance !== undefined){

      document.getElementById("balance").innerText =
        data.balance + " MES";

    }

  }catch(error){

    console.log(error);

  }

}


/* -------------------------
   BUY
------------------------- */

async function buyCoin(){

  const amount =
    document.getElementById("buyAmount").value;

  if(!amount || amount <= 0){

    alert("Enter a valid amount");

    return;

  }

  try{

    const response =
      await fetch(SERVER + "/buy",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          amount:Number(amount)
        })

      });

    const data =
      await response.json();

    if(response.ok){

      alert("Buy successful");

      loadBalance();

    }else{

      alert(data.error || "Buy failed");

    }

  }catch(error){

    alert("Cannot connect to server");

  }

}


/* -------------------------
   SELL
------------------------- */

async function sellCoin(){

  const amount =
    document.getElementById("sellAmount").value;

  if(!amount || amount <= 0){

    alert("Enter a valid amount");

    return;

  }

  try{

    const response =
      await fetch(SERVER + "/sell",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          amount:Number(amount)
        })

      });

    const data =
      await response.json();

    if(response.ok){

      alert("Sell successful");

      loadBalance();

    }else{

      alert(data.error || "Sell failed");

    }

  }catch(error){

    alert("Cannot connect to server");

  }

}


/* -------------------------
   SEND
------------------------- */

async function sendCoin(){

  const recipient =
    document.getElementById("recipient").value;

  const amount =
    document.getElementById("sendAmount").value;

  if(!recipient || !amount || amount <= 0){

    alert("Enter recipient and amount");

    return;

  }

  try{

    const response =
      await fetch(SERVER + "/send",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          recipient:recipient,
          amount:Number(amount)
        })

      });

    const data =
      await response.json();

    if(response.ok){

      alert("MesCoin sent successfully");

      loadBalance();

    }else{

      alert(data.error || "Transaction failed");

    }

  }catch(error){

    alert("Cannot connect to server");

  }

}


/* -------------------------
   START
------------------------- */

checkServer();

</script>

</body>
  </html>
