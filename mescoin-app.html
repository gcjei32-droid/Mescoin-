<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MesCoin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:white;
}

header{
  padding:18px 16px;
  background:#111a33;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:800;
  color:#55d6ff;
}

.status{
  font-size:12px;
  padding:7px 10px;
  border-radius:20px;
  background:#4a1720;
  color:#ff9aa4;
}

.status.online{
  background:#123d2a;
  color:#62e6a5;
}

main{
  padding:16px;
  max-width:650px;
  margin:auto;
}

.card{
  background:#121b35;
  border:1px solid #26345b;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

h2{
  margin:0 0 12px;
}

.price{
  font-size:30px;
  font-weight:800;
  margin:8px 0;
}

.muted{
  color:#9aa7c7;
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #344469;
  background:#0c1428;
  color:white;
  font-size:16px;
  margin:6px 0 10px;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.buy{
  background:#1fc77a;
  color:#04130c;
}

.sell{
  background:#ff5f6d;
  color:white;
}

.connect{
  background:#3c82ff;
  color:white;
}

#message{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  display:none;
}

.success{
  background:#123d2a;
  color:#62e6a5;
}

.error{
  background:#4a1720;
  color:#ff9aa4;
}

nav{
  position:sticky;
  bottom:0;
  background:#10182f;
  padding:10px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

nav button{
  background:#1a2748;
  color:white;
}
</style>
</head>

<body>

<header>
  <div class="logo">MesCoin</div>
  <div id="status" class="status">Checking server...</div>
</header>

<main>

<section class="card">
  <div class="muted">MESCOIN MARKET</div>
  <div class="price">MCN 100.00 Dollars</div>
  <div class="muted">
    MesCoin trading platform
  </div>
</section>

<section class="card">
  <h2>Trade MesCoin</h2>

  <label class="muted">Amount (MCN)</label>

  <input
    id="amount"
    type="number"
    min="1"
    placeholder="Enter amount"
  >

  <div class="grid">
    <button class="buy" onclick="placeOrder('buy')">
      BUY
    </button>

    <button class="sell" onclick="placeOrder('sell')">
      SELL
    </button>
  </div>

  <div id="message"></div>
</section>

<section class="card">
  <h2>Server</h2>

  <div class="muted">Connected API</div>

  <div style="margin:8px 0 14px;word-break:break-all">
    https://mescoin-server.onrender.com
  </div>

  <button class="connect" onclick="checkServer()">
    Check Server Connection
  </button>
</section>

<section class="card">
  <h2>Portfolio</h2>

  <div class="grid">

    <div>
      <div class="muted">MesCoin</div>
      <strong id="balance">0 MCN</strong>
    </div>

    <div>
      <div class="muted">KES value</div>
      <strong id="value">0 KES</strong>
    </div>

  </div>
</section>

</main>

<nav>
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})">
    Home
  </button>

  <button onclick="document.getElementById('amount').scrollIntoView({behavior:'smooth'})">
    Trade
  </button>

  <button onclick="document.getElementById('balance').scrollIntoView({behavior:'smooth'})">
    Portfolio
  </button>
</nav>

<script>

/* YOUR ONLINE RENDER SERVER */
const API = "https://mescoin-server.onrender.com";


function showMessage(text, ok=true){

  const box = document.getElementById("message");

  box.textContent = text;

  box.className = ok ? "success" : "error";

  box.style.display = "block";
}


/* CHECK RENDER SERVER */
async function checkServer(){

  const status = document.getElementById("status");

  status.textContent = "Checking...";
  status.className = "status";

  try{

    const response = await fetch(API + "/");

    if(!response.ok){
      throw new Error("Server error");
    }

    const data = await response.json();

    if(data.status === "online"){

      status.textContent = "Server online";
      status.className = "status online";

      showMessage(
        "Connected to MesCoin server.",
        true
      );

    }else{

      throw new Error("Invalid server response");

    }

  }catch(error){

    status.textContent = "Server offline";
    status.className = "status";

    showMessage(
      "Cannot connect to the MesCoin server.",
      false
    );
  }
}


/* BUY OR SELL */
async function placeOrder(type){

  const amount =
    Number(document.getElementById("amount").value);

  if(!amount || amount <= 0){

    showMessage(
      "Enter a valid MesCoin amount.",
      false
    );

    return;
  }

  try{

    showMessage(
      "Sending " + type + " order...",
      true
    );

    const response = await fetch(
      API + "/" + type,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          amount:amount,

          price:100,

          currency:"Dollars",

          time:new Date().toISOString()

        })
      }
    );

    const data = await response.json();

    if(data.success){

      showMessage(
        type.toUpperCase() +
        " order sent successfully.",
        true
      );

      document.getElementById("amount").value = "";

    }else{

      showMessage(
        data.message ||
        "Server rejected the order.",
        false
      );
    }

  }catch(error){

    showMessage(
      "Connection failed. Check that the Render server is running.",
      false
    );
  }
}


/* CHECK SERVER WHEN APP OPENS */
checkServer();

</script>

</body>
                                                      </html>
